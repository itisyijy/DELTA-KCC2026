baseline: fed_tta_loop
dataset: murata
data_format: parquet
# Update data_path to the manifest.json of your Murata legacy dataset
data_path: /home/jylee/datasets/archive/murata_15min_legacy_full/manifest.json
parquet_clients_dir: /home/jylee/datasets/archive/murata_15min_legacy_full/clients

model:
  seq_len: 192       # 192 × 15min = 48 hours input context
  pred_len: 96
  kernel_size: 49    # ~12 hour trend smoothing at 15min resolution
  individual: false
  revin_affine: true

batch_size: 256

# Path to trained FL model checkpoint
checkpoint_path: checkpoints/murata_fed/best.pt

tta:
  k_ratio: 0.25      # k = 24
  alpha: 1.0
  lambda0: 1.0
  gamma: 1.0
  lr: 0.001
  grad_clip: 1.0
  rollback_threshold: 3.0
  rollback_window: 20

feedback:
  delta_clip_norm: 1.0
  decay_factor: 0.9

device: cuda:1
seed: 0
output_dir: runs
checkpoint_dir: checkpoints
