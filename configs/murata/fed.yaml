baseline: fed
dataset: murata
data_format: parquet
# Update data_path to the manifest.json of your Murata legacy dataset
data_path: /home/jylee/datasets/archive/murata_15min_legacy_full/manifest.json
parquet_clients_dir: /home/jylee/datasets/archive/murata_15min_legacy_full/clients

model:
  seq_len: 192       # 192 × 15min = 48 hours input context
  pred_len: 96
  kernel_size: 25
  individual: false
  revin_affine: true

batch_size: 256
lr: 0.001
local_epochs: 3
global_rounds: 15

device: cuda:1
seed: 0
output_dir: runs
checkpoint_dir: checkpoints
