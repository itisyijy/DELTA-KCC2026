baseline: fed
dataset: murata
data_format: parquet
# Update data_path to the manifest.json of your Murata legacy dataset
data_path: /path/to/murata_legacy/manifest.json
parquet_clients_dir: /path/to/murata_legacy/clients

model:
  seq_len: 96        # 96 × 15min = 24 hours
  pred_len: 96
  kernel_size: 25
  individual: false
  revin_affine: true

batch_size: 64
lr: 0.001
local_epochs: 3
global_rounds: 50

device: cuda:0
seed: 0
output_dir: runs
checkpoint_dir: checkpoints
