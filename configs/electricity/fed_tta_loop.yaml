baseline: fed_tta_loop
dataset: electricity
data_format: csv
data_path: /home/jylee/datasets/electricity.csv
timestamp_col: date

model:
  seq_len: 336
  pred_len: 96
  kernel_size: 25    # ~1 day trend smoothing at 1h resolution
  individual: false
  revin_affine: true

batch_size: 256

# Path to trained FL model checkpoint
checkpoint_path: checkpoints/electricity_fed/best.pt

tta:
  k_ratio: 0.25      # k = 24
  alpha: 1.0
  lambda0: 1.0
  gamma: 1.0
  lr: 0.001
  grad_clip: 1.0
  rollback_threshold: 3.0
  rollback_window: 20

feedback:
  delta_clip_norm: 1.0
  decay_factor: 0.9

device: cuda:1
seed: 0
output_dir: runs
checkpoint_dir: checkpoints
