baseline: centralized
dataset: electricity
data_format: csv
data_path: /home/jylee/datasets/electricity.csv
timestamp_col: date

model:
  seq_len: 336       # 336 × 1h = 14 days input context
  pred_len: 96
  kernel_size: 25
  individual: false
  revin_affine: true

batch_size: 256
epochs: 15
lr: 0.001
patience: 7

device: cuda:1
seed: 0
output_dir: runs
checkpoint_dir: checkpoints
