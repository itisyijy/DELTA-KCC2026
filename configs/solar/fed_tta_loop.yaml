baseline: fed_tta_loop
dataset: solar
data_format: csv
data_path: /home/jylee/datasets/solar.csv
timestamp_col: LocalTime

model:
  seq_len: 288       # 288 × 10min = 48 hours input context
  pred_len: 96
  kernel_size: 73    # ~12 hour trend smoothing at 10min resolution
  individual: false
  revin_affine: true

batch_size: 256

# Path to trained FL model checkpoint
checkpoint_path: checkpoints/solar_fed/best.pt

tta:
  k_ratio: 0.25      # k = 24
  alpha: 1.0
  lambda0: 1.0
  gamma: 1.0
  lr: 0.001
  grad_clip: 1.0
  rollback_threshold: 3.0
  rollback_window: 20

feedback:
  delta_clip_norm: 1.0
  decay_factor: 0.9

device: cuda:1
seed: 0
output_dir: runs
checkpoint_dir: checkpoints
