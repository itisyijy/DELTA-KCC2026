baseline: dlinear_tta
dataset: solar
data_format: csv
data_path: /home/jylee/datasets/solar.csv
timestamp_col: LocalTime

model:
  seq_len: 96        # 96 × 10min = 16 hours
  pred_len: 96
  kernel_size: 25
  individual: false
  revin_affine: true

# Path to trained centralized model checkpoint
checkpoint_path: checkpoints/solar_centralized/best.pt

tta:
  k_ratio: 0.25      # k = 24
  alpha: 1.0
  lambda0: 1.0
  gamma: 1.0
  lr: 0.001
  grad_clip: 1.0
  rollback_threshold: 3.0
  rollback_window: 20

device: cuda:0
seed: 0
output_dir: runs
checkpoint_dir: checkpoints
